name: Run Checks and Tests
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.4
        cache: yarn
    - name: Enable Corepack
      run: corepack enable
    - name: Install dependencies
      run: yarn install --immutable
    - name: Export documentation references
      run: yarn docs:export --out /tmp/simplepost-docs
    - name: Upload documentation references
      uses: actions/upload-artifact@v4
      with:
        name: documentation-references
        path: /tmp/simplepost-docs
    - name: Check legacy documentation redirects
      run: node --test workers/legacy-docs-redirect/redirect.test.mjs
    - name: Check generated marketplace packages (offline)
      run: node --test scripts/plugin-packaging.test.mjs
    - name: Check Meta Muse integration examples (offline)
      run: yarn muse:check
    - name: Run checks
      env:
        NODE_OPTIONS: --max_old_space_size=4096
      run: yarn check
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.4
        cache: yarn
    - name: Enable Corepack
      run: corepack enable
    - name: Identify runner image
      id: media-image
      run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    - name: Cache media runtime packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/media-packages/*.deb
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.media-image.outputs.version }}-media-packages-v1
    - name: Install media inspection runtime
      run: |
        if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
          ffmpeg -version
          ffprobe -version
        else
          mkdir -p "$RUNNER_TEMP/media-packages/partial"
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives="$RUNNER_TEMP/media-packages" -o Binary::apt-get::APT::Keep-Downloaded-Packages=true install -y --no-install-recommends ffmpeg
        fi
    - name: Install dependencies
      run: yarn install --immutable
    - name: Run SDK tests with coverage
      env:
        NODE_OPTIONS: --max_old_space_size=4096
      run: yarn test:coverage --maxWorkers=2
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: 'false'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.4
        cache: yarn
    - name: Enable Corepack
      run: corepack enable
    - name: Identify runner image
      id: media-image
      run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    - name: Cache media runtime packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/media-packages/*.deb
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.media-image.outputs.version }}-media-packages-v1
    - name: Install media inspection runtime
      run: |
        if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
          ffmpeg -version
          ffprobe -version
        else
          mkdir -p "$RUNNER_TEMP/media-packages/partial"
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives="$RUNNER_TEMP/media-packages" -o Binary::apt-get::APT::Keep-Downloaded-Packages=true install -y --no-install-recommends ffmpeg
        fi
    - name: Install dependencies
      run: yarn install --immutable
    - name: Build CLI and SDK for end-to-end checks
      run: yarn workspace @simple-post/cli build
    - name: Install end-to-end browser
      run: yarn workspace @simple-post/e2e exec playwright install --with-deps chromium
    - name: Run offline end-to-end checks
      run: xvfb-run --auto-servernum yarn e2e:test --shard=${{ matrix.shard }}/4
    - name: Build and smoke-test plugin extensions
      run: |
        yarn workspace @simple-post/scheduler build:mcp-widgets
        yarn workspace @simple-post/e2e extensions:smoke
      if: matrix.shard == 1
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.4
        cache: yarn
    - name: Enable Corepack
      run: corepack enable
    - name: Install dependencies
      run: yarn install --immutable
    - name: Run CLI tests
      env:
        NODE_OPTIONS: --max_old_space_size=4096
      run: yarn workspace @simple-post/cli test
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.4
        cache: yarn
    - name: Enable Corepack
      run: corepack enable
    - name: Install dependencies
      run: yarn install --immutable
    - name: Validate complete scheduler localization
      run: |
        yarn workspace @simple-post/scheduler test:i18n
        yarn workspace @simple-post/scheduler i18n:copy:check
        yarn workspace @simple-post/scheduler artwork:check
    - name: Run Scheduler tests
      env:
        NODE_OPTIONS: --max_old_space_size=4096
      run: yarn workspace @simple-post/scheduler test
    - name: Apply migrations and test PostgreSQL concurrency
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simplepost_review
        INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simplepost_review
      run: |
        yarn workspace @simple-post/scheduler prisma migrate deploy
        yarn workspace @simple-post/scheduler jest -c jest.integration.config.cjs --runInBand
    - name: Verify email OTP, Google login and signup attribution
      working-directory: scheduler
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simplepost_review
        BETTER_AUTH_SECRET: local-review-better-auth-secret-at-least-32
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        SELF_HOSTED: 'false'
        GOOGLE_CLIENT_ID: local-review-google
        GOOGLE_CLIENT_SECRET: local-review-google-secret
        RESEND_API_KEY: re_local_review
        HOMEPAGE_EXPERIMENT_SECRET: local-review-experiment-secret-at-least-32
        ENABLE_OPENAI_TEST_LOGIN: 'true'
      run: |
        node --import ../e2e/node_modules/tsx/dist/loader.mjs integration/email-otp.ts
        node --import ../e2e/node_modules/tsx/dist/loader.mjs integration/auth-attribution.ts
        node --import ../e2e/node_modules/tsx/dist/loader.mjs integration/ads-auth.ts
        node --import ../e2e/node_modules/tsx/dist/loader.mjs integration/experiments.ts
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simplepost_review
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d simplepost_review" --health-interval 1s --health-timeout
          5s --health-retries 5
  test:
    name: test (22.23.4)
    runs-on: ubuntu-latest
    needs:
    - source
    - sdk
    - browser
    - cli
    - scheduler
    if: ${{ always() }}
    steps:
    - name: Require all checks to pass
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
