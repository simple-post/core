name: Run Checks and Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simplepost_review
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d simplepost_review"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install media inspection runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: yarn install --immutable

      - name: Export documentation references
        run: yarn docs:export --out /tmp/simplepost-docs

      - name: Upload documentation references
        uses: actions/upload-artifact@v4
        with:
          name: documentation-references
          path: /tmp/simplepost-docs

      - name: Check legacy documentation redirects
        run: node --test workers/legacy-docs-redirect/redirect.test.mjs

      - name: Check Meta Muse integration examples (offline)
        run: yarn muse:check

      - name: Check Personal Muse connector preparation (offline)
        run: yarn muse:personal:check

      - name: Run checks
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: yarn check

      - name: Run SDK tests with coverage
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: yarn test:coverage

      - name: Build SDK and CLI for end-to-end checks
        run: |
          yarn workspace @simple-post/sdk build
          yarn workspace @simple-post/cli build

      - name: Install end-to-end browser
        run: yarn workspace @simple-post/e2e exec playwright install --with-deps chromium

      - name: Run offline end-to-end checks
        run: xvfb-run --auto-servernum yarn e2e:test

      - name: Build and smoke-test plugin extensions
        run: |
          yarn workspace @simple-post/scheduler build:mcp-widgets
          yarn workspace @simple-post/e2e extensions:smoke

      - name: Run CLI tests
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: yarn workspace @simple-post/cli test

      - name: Run Scheduler tests
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: yarn workspace @simple-post/scheduler test

      - name: Apply migrations and test PostgreSQL concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simplepost_review
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simplepost_review
        run: |
          yarn workspace @simple-post/scheduler prisma migrate deploy
          yarn workspace @simple-post/scheduler jest -c jest.integration.config.cjs --runInBand

      - name: Verify homepage experiment authentication and shared activation milestones
        working-directory: scheduler
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/simplepost_review
          BETTER_AUTH_SECRET: local-review-better-auth-secret-at-least-32
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SELF_HOSTED: "false"
          GOOGLE_CLIENT_ID: local-review-google
          GOOGLE_CLIENT_SECRET: local-review-google-secret
          RESEND_API_KEY: re_local_review
          HOMEPAGE_EXPERIMENT_SECRET: local-review-experiment-secret-at-least-32
        run: node --import ../e2e/node_modules/tsx/dist/loader.mjs integration/experiments.ts

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
